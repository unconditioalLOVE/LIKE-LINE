<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE-LINE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      height: 90vh;
      max-height: 800px;
      background-color: #000000;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    /* ヘッダー */
    .header {
      background-color: #111111;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222222;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      font-size: 20px;
      cursor: pointer;
    }

    .partner-name {
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .header-icons {
      display: flex;
      gap: 16px;
      font-size: 18px;
      color: #cccccc;
    }

    /* アナウンスバー */
    .announcement {
      background-color: #1c1c1e;
      padding: 8px 16px;
      font-size: 13px;
      color: #dddddd;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #2a2a2a;
    }

    .announcement-icon {
      color: #2b82f6;
    }

    /* チャットエリア */
    .chat-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #0b0b0b;
    }

    /* システムメッセージ */
    .system-msg {
      align-self: center;
      background-color: #1c1c1e;
      color: #aaaaaa;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 12px;
      max-width: 80%;
      text-align: center;
      margin: 4px 0;
    }

    /* メッセージ共通 */
    .msg-group {
      display: flex;
      gap: 8px;
      max-width: 80%;
    }

    .msg-group.partner {
      align-self: flex-start;
    }

    .msg-group.me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #333333;
      flex-shrink: 0;
      cursor: pointer;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
    }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .partner .msg-bubble {
      background-color: #262628;
      color: #ffffff;
      border-top-left-radius: 4px;
    }

    .me .msg-bubble {
      background-color: #25d366;
      color: #000000;
      border-top-right-radius: 4px;
      font-weight: 500;
    }

    .msg-meta {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      font-size: 10px;
      color: #888888;
      margin: 0 4px;
      min-width: 35px;
    }

    .me .msg-meta {
      align-items: flex-end;
    }

    .partner .msg-meta {
      align-items: flex-start;
    }

    .msg-img {
      max-width: 200px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* 入力・設定エリア */
    .controls {
      background-color: #161616;
      border-top: 1px solid #262626;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sender-switch {
      display: flex;
      background-color: #262626;
      border-radius: 8px;
      padding: 2px;
    }

    .switch-btn {
      flex: 1;
      padding: 6px;
      border: none;
      background: none;
      color: #888888;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .switch-btn.active.me {
      background-color: #25d366;
      color: #000000;
    }

    .switch-btn.active.partner {
      background-color: #444444;
      color: #ffffff;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .text-input {
      flex: 1;
      background-color: #262626;
      border: 1px solid #333333;
      border-radius: 20px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #888888;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .send-btn {
      background-color: #25d366;
      color: #000000;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #888888;
      padding: 0 4px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    #file-input, #avatar-input {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <div class="header">
    <div class="header-left">
      <span class="back-btn">‹</span>
      <span class="partner-name" id="partner-name-display" onclick="changePartnerName()">Jun Takabe</span>
    </div>
    <div class="header-icons">
      <span>🔍</span>
      <span>📞</span>
      <span>📅</span>
      <span>☰</span>
    </div>
  </div>

  <!-- アナウンスバー -->
  <div class="announcement">
    <span class="announcement-icon">📢</span>
    <span id="announcement-text" onclick="changeAnnouncement()">君は家に帰っている途中で死んだ。</span>
  </div>

  <!-- チャットエリア -->
  <div class="chat-area" id="chat-area">
    <!-- 初期メッセージ -->
    <div class="msg-group partner">
      <img src="https://via.placeholder.com/100/444444/ffffff?text=Icon" class="avatar" onclick="triggerAvatarUpload()">
      <div class="msg-content">
        <div class="msg-bubble">なんでだ</div>
      </div>
      <div class="msg-meta">
        <span>0:21</span>
      </div>
    </div>

    <div class="msg-group me">
      <div class="msg-content">
        <div class="msg-bubble">受験</div>
      </div>
      <div class="msg-meta">
        <span>既読</span>
        <span>0:21</span>
      </div>
    </div>

    <div class="msg-group partner">
      <img src="https://via.placeholder.com/100/444444/ffffff?text=Icon" class="avatar" onclick="triggerAvatarUpload()">
      <div class="msg-content">
        <div class="msg-bubble">そうなんかな</div>
      </div>
      <div class="msg-meta">
        <span>0:21</span>
      </div>
    </div>

    <div class="system-msg">メッセージの送信を取り消しました<br>通知なしで送信を取り消す方法</div>

    <div class="msg-group me">
      <div class="msg-content">
        <div class="msg-bubble">消えてないや</div>
      </div>
      <div class="msg-meta">
        <span>既読</span>
        <span>0:22</span>
      </div>
    </div>
  </div>

  <!-- コントロールパネル -->
  <div class="controls">
    <div class="sender-switch">
      <button class="switch-btn active me" id="btn-me" onclick="setSender('me')">自分 (緑)</button>
      <button class="switch-btn partner" id="btn-partner" onclick="setSender('partner')">相手 (黒)</button>
      <button class="switch-btn" id="btn-system" onclick="setSender('system')">システム</button>
    </div>

    <div class="input-row">
      <button class="icon-btn" onclick="document.getElementById('file-input').click()">📷</button>
      <input type="file" id="file-input" accept="image/*" onchange="sendImage(event)">
      <input type="file" id="avatar-input" accept="image/*" onchange="changeAvatar(event)">
      <input type="text" class="text-input" id="message-input" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()">▲</button>
    </div>

    <div class="option-row">
      <label class="checkbox-label">
        <input type="checkbox" id="read-status" checked> 自分側に「既読」をつける
      </label>
      <span style="cursor:pointer;" onclick="clearChat()">クリア</span>
    </div>
  </div>
</div>

<script>
  let currentSender = 'me';
  let partnerAvatarUrl = 'https://via.placeholder.com/100/444444/ffffff?text=Icon';

  function setSender(sender) {
    currentSender = sender;
    document.getElementById('btn-me').className = 'switch-btn' + (sender === 'me' ? ' active me' : '');
    document.getElementById('btn-partner').className = 'switch-btn' + (sender === 'partner' ? ' active partner' : '');
    document.getElementById('btn-system').className = 'switch-btn' + (sender === 'system' ? ' active partner' : '');
  }

  function getCurrentTime() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, '0');
    return `${hours}:${minutes}`;
  }

  function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text) return;

    const chatArea = document.getElementById('chat-area');
    const timeStr = getCurrentTime();

    if (currentSender === 'system') {
      const sysDiv = document.createElement('div');
      sysDiv.className = 'system-msg';
      sysDiv.innerText = text;
      chatArea.appendChild(sysDiv);
    } else if (currentSender === 'me') {
      const isRead = document.getElementById('read-status').checked;
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg-group me';
      msgDiv.innerHTML = `
        <div class="msg-content">
          <div class="msg-bubble">${escapeHtml(text)}</div>
        </div>
        <div class="msg-meta">
          ${isRead ? '<span>既読</span>' : ''}
          <span>${timeStr}</span>
        </div>
      `;
      chatArea.appendChild(msgDiv);
    } else {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg-group partner';
      msgDiv.innerHTML = `
        <img src="${partnerAvatarUrl}" class="avatar" onclick="triggerAvatarUpload()">
        <div class="msg-content">
          <div class="msg-bubble">${escapeHtml(text)}</div>
        </div>
        <div class="msg-meta">
          <span>${timeStr}</span>
        </div>
      `;
      chatArea.appendChild(msgDiv);
    }

    input.value = '';
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  }

  function sendImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const imgUrl = e.target.result;
      const chatArea = document.getElementById('chat-area');
      const timeStr = getCurrentTime();

      if (currentSender === 'me') {
        const isRead = document.getElementById('read-status').checked;
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg-group me';
        msgDiv.innerHTML = `
          <div class="msg-content">
            <img src="${imgUrl}" class="msg-img">
          </div>
          <div class="msg-meta">
            ${isRead ? '<span>既読</span>' : ''}
            <span>${timeStr}</span>
          </div>
        `;
        chatArea.appendChild(msgDiv);
      } else {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg-group partner';
        msgDiv.innerHTML = `
          <img src="${partnerAvatarUrl}" class="avatar" onclick="triggerAvatarUpload()">
          <div class="msg-content">
            <img src="${imgUrl}" class="msg-img">
          </div>
          <div class="msg-meta">
            <span>${timeStr}</span>
          </div>
        `;
        chatArea.appendChild(msgDiv);
      }
      chatArea.scrollTop = chatArea.scrollHeight;
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function changePartnerName() {
    const currentName = document.getElementById('partner-name-display').innerText;
    const newName = prompt('相手の名前を入力してください:', currentName);
    if (newName !== null && newName.trim() !== '') {
      document.getElementById('partner-name-display').innerText = newName.trim();
    }
  }

  function changeAnnouncement() {
    const currentText = document.getElementById('announcement-text').innerText;
    const newText = prompt('アナウンスのテキストを入力してください:', currentText);
    if (newText !== null) {
      document.getElementById('announcement-text').innerText = newText;
    }
  }

  function triggerAvatarUpload() {
    document.getElementById('avatar-input').click();
  }

  function changeAvatar(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      partnerAvatarUrl = e.target.result;
      const avatars = document.querySelectorAll('.partner .avatar');
      avatars.forEach(img => img.src = partnerAvatarUrl);
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function clearChat() {
    if (confirm('チャット履歴を全消去しますか？')) {
      document.getElementById('chat-area').innerHTML = '';
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
  }
</script>

</body>
</html>
