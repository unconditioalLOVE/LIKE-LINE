<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LINE風チャット</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ヘッダー */
    .header {
      background-color: #111111;
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1a1a1a;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      font-size: 24px;
      font-weight: 300;
      cursor: pointer;
      color: #ffffff;
    }

    .partner-name {
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-icon-svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      cursor: pointer;
    }

    .calendar-icon-box {
      width: 20px;
      height: 20px;
      border: 1.5px solid #ffffff;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      cursor: pointer;
    }

    .calendar-icon-box::before {
      content: '';
      position: absolute;
      top: -3px;
      left: 3px;
      width: 2px;
      height: 3px;
      background-color: #ffffff;
      box-shadow: 8px 0 0 #ffffff;
    }

    .calendar-date {
      font-size: 10px;
      font-weight: bold;
      line-height: 1;
      margin-bottom: 2px;
    }

    /* アナウンスバー */
    .announcement {
      background-color: #1c1c1e;
      padding: 10px 16px;
      font-size: 14px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #28282a;
      z-index: 9;
      flex-shrink: 0;
    }

    .announcement-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .announcement-icon {
      color: #3f82f8;
      font-size: 16px;
      flex-shrink: 0;
    }

    .announcement-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      font-size: 13.5px;
    }

    .announcement-arrow {
      color: #666666;
      font-size: 12px;
    }

    /* チャットエリア */
    .chat-area {
      flex: 1;
      padding: 12px 12px 20px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background-color: #0b0b0b;
      position: relative;
    }

    /* 下移動ボタン */
    .scroll-bottom-btn {
      position: absolute;
      right: 16px;
      bottom: 80px;
      width: 36px;
      height: 36px;
      background-color: rgba(30, 30, 30, 0.85);
      border: 1px solid #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888888;
      font-size: 18px;
      cursor: pointer;
      z-index: 5;
    }

    /* システムメッセージ */
    .system-msg {
      align-self: center;
      background-color: #1a1a1c;
      color: #999999;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 12px;
      max-width: 85%;
      text-align: center;
      margin: 12px 0;
      line-height: 1.4;
    }

    /* メッセージグループ */
    .msg-group {
      display: flex;
      margin-bottom: 6px;
      max-width: 82%;
    }

    .msg-group.partner {
      align-self: flex-start;
    }

    .msg-group.me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    /* アイコン領域 */
    .avatar-holder {
      width: 38px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 40%;
      object-fit: cover;
      background-color: #333333;
      cursor: pointer;
      display: block;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
    }

    /* 吹き出し共通 */
    .msg-bubble {
      padding: 8px 12px;
      font-size: 14.5px;
      line-height: 1.35;
      word-break: break-word;
      white-space: pre-wrap;
      letter-spacing: -0.1px;
      position: relative;
    }

    /* 相手の吹き出し */
    .partner .msg-bubble {
      background-color: #262628;
      color: #ffffff;
      border-radius: 18px;
      border-top-left-radius: 0px;
    }

    .partner-tail-img {
      position: absolute;
      top: 0px;
      left: -3px;
      width: 13px;
      height: auto;
      z-index: 2;
      transform: scaleX(-1);
    }

    /* 自分の吹き出し（角の位置と大きさを調整してピッタリ重ねる） */
    .me .msg-bubble {
      background-color: #6be779;
      color: #000000;
      border-radius: 18px;
      border-top-right-radius: 0px;
      font-weight: 500;
    }

    .me-tail-img {
      position: absolute;
      top: 0px;
      right: -3px;
      width: 13px;
      height: auto;
      z-index: 2;
    }

    .msg-meta {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      font-size: 10px;
      color: #777777;
      margin: 0 5px;
      min-width: 32px;
      user-select: none;
    }

    .me .msg-meta {
      align-items: flex-end;
      text-align: right;
    }

    .partner .msg-meta {
      align-items: flex-start;
      text-align: left;
    }

    .msg-img {
      max-width: 210px;
      border-radius: 14px;
      cursor: pointer;
      display: block;
    }

    /* 下部LINE入力バー */
    .input-bar {
      background-color: #121212;
      border-top: 1px solid #1f1f1f;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .input-icons-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .plus-btn {
      font-size: 24px;
      color: #8e8e93;
      font-weight: 300;
      cursor: pointer;
      line-height: 1;
    }

    .collapse-arrow {
      font-size: 20px;
      color: #8e8e93;
      cursor: pointer;
      display: none;
      font-weight: bold;
      line-height: 1;
    }

    .tool-icon-svg {
      width: 22px;
      height: 22px;
      fill: #8e8e93;
      cursor: pointer;
    }

    .input-wrapper {
      flex: 1;
      background-color: #262628;
      border-radius: 20px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
    }

    .text-input {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .text-input::placeholder {
      color: #666666;
    }

    .input-icons-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .send-action-btn {
      width: 28px;
      height: 28px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .send-action-btn.active-blue {
      background-color: #2b82f6;
      border-radius: 50%;
      width: 30px;
      height: 30px;
    }

    .send-action-btn.active-blue svg {
      fill: #ffffff;
      width: 16px;
      height: 16px;
    }

    /* 管理用コントロールパネル */
    .control-panel {
      background-color: #1a1a1c;
      border-top: 1px solid #2a2a2c;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .sender-switch {
      display: flex;
      background-color: #0d0d0d;
      border-radius: 8px;
      padding: 2px;
    }

    .switch-btn {
      flex: 1;
      padding: 5px;
      border: none;
      background: none;
      color: #777777;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .switch-btn.active.me {
      background-color: #6be779;
      color: #000000;
    }

    .switch-btn.active.partner {
      background-color: #333333;
      color: #ffffff;
    }

    .switch-btn.active.system {
      background-color: #444444;
      color: #ffffff;
    }

    .option-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #aaaaaa;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    #file-input, #avatar-input {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <div class="header">
    <div class="header-left">
      <span class="back-btn">‹</span>
      <span class="partner-name" id="partner-name-display" onclick="changePartnerName()">Ryo Murakami</span>
    </div>
    <div class="header-icons">
      <svg class="header-icon-svg" viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <svg class="header-icon-svg" viewBox="0 0 24 24">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
      <div class="calendar-icon-box" onclick="alert('カレンダー')">
        <span class="calendar-date">17</span>
      </div>
      <svg class="header-icon-svg" viewBox="0 0 24 24" style="width:22px; height:22px;">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </div>
  </div>

  <!-- アナウンスバー -->
  <div class="announcement">
    <div class="announcement-left">
      <span class="announcement-icon">📢</span>
      <span class="announcement-text" id="announcement-text" onclick="changeAnnouncement()">インスタ見るな</span>
    </div>
    <span class="announcement-arrow">∨</span>
  </div>

  <!-- チャットエリア -->
  <div class="chat-area" id="chat-area" onclick="blurInput()">
    <div class="scroll-bottom-btn" onclick="event.stopPropagation(); scrollToBottom()">↓</div>
  </div>

  <!-- LINE風入力バー -->
  <div class="input-bar" id="input-bar">
    <div class="input-icons-left">
      <span class="collapse-arrow" id="collapse-arrow" onclick="blurInput()">‹</span>
      <span class="plus-btn" id="plus-btn" onclick="document.getElementById('file-input').click()">＋</span>
      <svg class="tool-icon-svg" id="cam-icon" viewBox="0 0 24 24" onclick="document.getElementById('file-input').click()">
        <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
      </svg>
      <svg class="tool-icon-svg" id="img-icon" viewBox="0 0 24 24" onclick="document.getElementById('file-input').click()">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/>
      </svg>
    </div>
    <div class="input-wrapper">
      <input type="text" class="text-input" id="message-input" placeholder="Aa" onfocus="focusInput()" oninput="handleInput()" onkeypress="handleKeyPress(event)">
    </div>
    <div class="input-icons-right">
      <svg class="tool-icon-svg" id="emoji-icon" viewBox="0 0 24 24">
        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
      </svg>
      <button class="send-action-btn" id="send-action-btn" onclick="handleSendButtonAction()">
        <svg viewBox="0 0 24 24" id="send-mic-svg">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 管理用設定パネル -->
  <div class="control-panel">
    <div class="sender-switch">
      <button class="switch-btn active me" id="btn-me" onclick="setSender('me')">自分 (緑)</button>
      <button class="switch-btn partner" id="btn-partner" onclick="setSender('partner')">相手 (黒)</button>
      <button class="switch-btn" id="btn-system" onclick="setSender('system')">システム</button>
    </div>
    <div class="option-row">
      <label class="checkbox-label">
        <input type="checkbox" id="read-status" checked> 既読をつける
      </label>
      <span style="cursor:pointer; color:#ff4444;" onclick="clearChat()">チャットクリア</span>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" onchange="sendImage(event)">
  <input type="file" id="avatar-input" accept="image/*" onchange="changeAvatar(event)">
</div>

<script>
  let currentSender = 'me';
  let partnerAvatarUrl = 'https://via.placeholder.com/100/444444/ffffff?text=Icon';
  let tailImageUrl = 'tail.jpg'; 
  let isInputFocused = false;
  
  const initialMessages = [
    { sender: 'me', text: 'フライングしたのやっぱりこが', time: '19:51' },
    { sender: 'me', text: '動画見た', time: '19:51' },
    { sender: 'partner', text: 'がちか', time: '19:53' },
    { sender: 'partner', text: '動画ほしい', time: '19:53' },
    { sender: 'me', text: '俺のお父さん俺しか写してないからお前最後見れない、、', time: '20:02' },
    { sender: 'me', text: '分かってない', time: '20:02' },
    { sender: 'me', text: '途中しかないけどえーか？', time: '20:03' },
    { sender: 'me', text: 'だから俺とお前の差がみれない', time: '20:03' },
    { sender: 'partner', text: 'あーー', time: '20:04' },
    { sender: 'partner', text: 'とりまほしい', time: '20:04' },
    { sender: 'me', text: '普通に意味がわからない', time: '20:06' },
    { sender: 'me', text: '両親来なかったんか', time: '20:06' },
    { sender: 'partner', text: '多分来れてない', time: '20:11' },
    { sender: 'partner', text: 'ああお前しか映ってないのか', time: '20:11' }
  ];

  window.onload = function() {
    initialMessages.forEach(msg => {
      appendMessage(msg.sender, msg.text, msg.time, false, false);
    });
    renderChat();
    scrollToBottom();
  };

  let messagesData = [];

  function setSender(sender) {
    currentSender = sender;
    document.getElementById('btn-me').className = 'switch-btn' + (sender === 'me' ? ' active me' : '');
    document.getElementById('btn-partner').className = 'switch-btn' + (sender === 'partner' ? ' active partner' : '');
    document.getElementById('btn-system').className = 'switch-btn' + (sender === 'system' ? ' active system' : '');
  }

  function getCurrentTime() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, '0');
    return `${hours}:${minutes}`;
  }

  function focusInput() {
    isInputFocused = true;
    document.getElementById('collapse-arrow').style.display = 'block';
    document.getElementById('plus-btn').style.display = 'none';
    document.getElementById('cam-icon').style.display = 'none';
    document.getElementById('img-icon').style.display = 'none';
    updateSendButtonState();
  }

  function blurInput() {
    isInputFocused = false;
    document.getElementById('message-input').blur();
    document.getElementById('collapse-arrow').style.display = 'none';
    document.getElementById('plus-btn').style.display = 'block';
    document.getElementById('cam-icon').style.display = 'block';
    document.getElementById('img-icon').style.display = 'block';
    updateSendButtonState();
  }

  function handleInput() {
    updateSendButtonState();
  }

  function updateSendButtonState() {
    const text = document.getElementById('message-input').value;
    const btn = document.getElementById('send-action-btn');
    const svgElem = document.getElementById('send-mic-svg');

    if (text.trim().length > 0 || isInputFocused) {
      btn.className = 'send-action-btn active-blue';
      svgElem.innerHTML = '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>';
    } else {
      btn.className = 'send-action-btn';
      svgElem.innerHTML = '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>';
    }
  }

  function handleSendButtonAction() {
    const text = document.getElementById('message-input').value;
    if (text.trim().length > 0) {
      sendMessage();
    }
  }

  function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text) return;

    const timeStr = getCurrentTime();
    const isRead = document.getElementById('read-status').checked;

    appendMessage(currentSender, text, timeStr, isRead, false);
    renderChat();
    input.value = '';
    updateSendButtonState();
    scrollToBottom();
  }

  function appendMessage(sender, content, time, isRead, isImage) {
    messagesData.push({
      sender: sender,
      content: content,
      time: time,
      isRead: isRead,
      isImage: isImage
    });
  }

  function renderChat() {
    const chatArea = document.getElementById('chat-area');
    const scrollBtn = chatArea.querySelector('.scroll-bottom-btn');
    chatArea.innerHTML = '';
    chatArea.appendChild(scrollBtn);

    for (let i = 0; i < messagesData.length; i++) {
      const msg = messagesData[i];

      if (msg.sender === 'system') {
        const sysDiv = document.createElement('div');
        sysDiv.className = 'system-msg';
        sysDiv.innerHTML = escapeHtml(msg.content);
        chatArea.appendChild(sysDiv);
        continue;
      }

      const msgDiv = document.createElement('div');
      msgDiv.className = `msg-group ${msg.sender}`;

      let avatarHtml = '';
      if (msg.sender === 'partner') {
        avatarHtml = `
          <div class="avatar-holder">
            <img src="${partnerAvatarUrl}" class="avatar" onclick="event.stopPropagation(); triggerAvatarUpload()">
          </div>`;
      }

      let metaHtml = `
        <div class="msg-meta">
          ${msg.sender === 'me' && msg.isRead ? '<span>既読</span>' : ''}
          <span>${msg.time}</span>
        </div>`;

      let contentHtml = '';
      if (msg.isImage) {
        contentHtml = `<img src="${msg.content}" class="msg-img">`;
      } else {
        let tailImg = '';
        if (msg.sender === 'me') {
          tailImg = `<img src="${tailImageUrl}" class="me-tail-img">`;
        } else {
          tailImg = `<img src="${tailImageUrl}" class="partner-tail-img">`;
        }
        contentHtml = `<div class="msg-bubble">${escapeHtml(msg.content)}${tailImg}</div>`;
      }

      if (msg.sender === 'partner') {
        msgDiv.innerHTML = `
          ${avatarHtml}
          <div class="msg-content">${contentHtml}</div>
          ${metaHtml}
        `;
      } else {
        msgDiv.innerHTML = `
          <div class="msg-content">${contentHtml}</div>
          ${metaHtml}
        `;
      }

      chatArea.appendChild(msgDiv);
    }
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  }

  function sendImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const timeStr = getCurrentTime();
      const isRead = document.getElementById('read-status').checked;
      appendMessage(currentSender, e.target.result, timeStr, isRead, true);
      renderChat();
      scrollToBottom();
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function changePartnerName() {
    const currentName = document.getElementById('partner-name-display').innerText;
    const newName = prompt('相手の名前を入力してください:', currentName);
    if (newName !== null && newName.trim() !== '') {
      document.getElementById('partner-name-display').innerText = newName.trim();
    }
  }

  function changeAnnouncement() {
    const currentText = document.getElementById('announcement-text').innerText;
    const newText = prompt('アナウンスのテキストを入力してください:', currentText);
    if (newText !== null) {
      document.getElementById('announcement-text').innerText = newText;
    }
  }

  function triggerAvatarUpload() {
    document.getElementById('avatar-input').click();
  }

  function changeAvatar(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      partnerAvatarUrl = e.target.result;
      renderChat();
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function clearChat() {
    if (confirm('チャット履歴を全消去しますか？')) {
      messagesData = [];
      renderChat();
    }
  }

  function scrollToBottom() {
    const chatArea = document.getElementById('chat-area');
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
  }
</script>

</body>
</html>
