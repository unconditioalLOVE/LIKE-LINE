<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LINE風チャット</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #1a1a1a;            /* チャット・ヘッダー背景 */
      --bar: #111111;           /* 入力バー背景 */
      --bubble-partner: #2a2a2a;
      --bubble-me: #69e779;
      --meta: #8d8d8d;          /* 時刻・既読 */
      --icon: #b7b7b7;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      max-height: 932px;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ---------- ヘッダー ---------- */
    .header {
      background-color: var(--bg);
      height: 52px;
      padding: 0 20px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .back-btn {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
      flex-shrink: 0;
    }

    .partner-name {
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 21px;
      flex-shrink: 0;
    }

    .header-icon-svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
    }

    .calendar-icon-box {
      width: 20px;
      height: 22px;
      border: 1.7px solid #ffffff;
      border-radius: 4px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .calendar-icon-box::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 3px;
      width: 1.7px;
      height: 5px;
      background-color: #ffffff;
      box-shadow: 9px 0 0 #ffffff;
    }

    .calendar-date {
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 3px;
    }

    /* ---------- アナウンスバー（角丸カード） ---------- */
    .announcement {
      background-color: var(--bubble-partner);
      margin: 6px 6px 0;
      height: 46px;
      padding: 0 16px;
      border-radius: 12px;
      font-size: 14px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 9;
      flex-shrink: 0;
    }

    .announcement-left {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
    }

    .announcement-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #4d73ff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .announcement-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .announcement-arrow {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #606060;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ---------- チャットエリア ---------- */
    .chat-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .chat-area {
      flex: 1;
      min-height: 0;
      padding: 10px 8px 12px 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
    }

    /* 下移動ボタン（スクロールしても画面に固定） */
    .scroll-bottom-btn {
      position: absolute;
      right: 8px;
      bottom: 9px;
      width: 36px;
      height: 36px;
      background-color: #2a2a2a;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
    }

    .scroll-bottom-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #b7b7b7;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* システムメッセージ */
    .system-msg {
      align-self: center;
      background-color: #262626;
      color: #999999;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 12px;
      max-width: 85%;
      text-align: center;
      margin: 12px 0;
      line-height: 1.4;
    }

    /* ---------- メッセージ行 ---------- */
    .msg-group {
      display: flex;
      align-items: flex-start;
      margin-top: 7.5px;           /* 別グループとの間隔 */
    }
    .msg-group:first-of-type { margin-top: 0; }

    .msg-group.partner { align-self: flex-start; }

    .msg-group.me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    /* 同じ分が続く2通目以降: 間隔を詰め、しっぽ・アイコンを消す */
    .msg-group.grouped { margin-top: 6px; }
    .msg-group.grouped .avatar { visibility: hidden; pointer-events: none; }
    .msg-group.grouped .msg-bubble::before,
    .msg-group.grouped .msg-bubble::after { display: none; }

    /* 相手の新グループ: アイコン上端が前の吹き出しから約3.5px下 */
    .msg-group.partner:not(.grouped) { margin-top: 3.5px; }
    .msg-group.partner:not(.grouped):first-of-type { margin-top: 0; }

    /* アイコン（円形・直径30px） */
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
      margin-right: 6px;
      cursor: pointer;
      background-color: #333333;
    }

    /* 吹き出しはアイコン上端より4px下げる */
    .msg-group.partner .msg-bubble { margin-top: 4px; }
    .msg-group.partner.grouped .msg-bubble { margin-top: 0; }

    .msg-content {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ---------- 吹き出し共通 ---------- */
    .msg-bubble {
      display: flex;
      align-items: center;
      min-height: 35px;
      max-width: 252px;
      padding: 7.5px 14px;
      font-size: 14px;
      line-height: 17.3px;
      word-break: break-word;
      white-space: pre-wrap;
      position: relative;
      isolation: isolate;
      border-radius: 19px;
    }

    /* 自分（右）: しっぽは右上 */
    .me .msg-bubble {
      background: var(--bubble-me);
      color: #000;
      font-weight: 500;
    }
    .me .msg-bubble::after {
      content: "";
      position: absolute;
      top: 0;
      right: -4px;
      width: 14px;
      height: 12px;
      background: var(--bubble-me);
      z-index: -1;
      clip-path: path("M 0 6 L 2.6 4.2 Q 10.5 4.3 12.9 0.8 C 12 5 10 8.6 7.6 11.2 L 0 11 Z");
    }

    /* 相手（左）: しっぽは左上 */
    .partner .msg-bubble {
      background: var(--bubble-partner);
      color: #fff;
    }
    .partner .msg-bubble::before {
      content: "";
      position: absolute;
      top: 0;
      left: -4px;
      width: 14px;
      height: 12px;
      background: var(--bubble-partner);
      z-index: -1;
      clip-path: path("M 14 6 L 11.4 4.2 Q 3.5 4.3 1.1 0.8 C 2 5 4 8.6 6.4 11.2 L 14 11 Z");
    }

    /* 時刻・既読: 吹き出しの下端に揃える */
    .msg-meta {
      display: flex;
      flex-direction: column;
      align-self: flex-end;
      margin: 0 6px 4px;
      font-size: 9px;
      line-height: 12px;
      color: var(--meta);
      white-space: nowrap;
      user-select: none;
      flex-shrink: 0;
    }

    .me .msg-meta {
      align-items: flex-end;
      text-align: right;
    }

    .partner .msg-meta {
      align-items: flex-start;
      text-align: left;
    }

    .msg-img {
      max-width: 210px;
      border-radius: 14px;
      cursor: pointer;
      display: block;
    }
    .msg-group.partner .msg-img { margin-top: 4px; }
    .msg-group.partner.grouped .msg-img { margin-top: 0; }

    /* ---------- 下部LINE入力バー ---------- */
    .input-bar {
      background-color: var(--bar);
      padding: 8px 12px 8px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .input-icons-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .collapse-arrow {
      width: 24px;
      height: 24px;
      stroke: var(--icon);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
      display: none;
    }

    .tool-icon-svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: var(--icon);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
      flex-shrink: 0;
    }

    .input-wrapper {
      flex: 1;
      min-width: 0;
      background-color: #1f1f1f;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      height: 34px;
      padding: 0 8px 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .text-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    .text-input::placeholder {
      color: #616161;
    }

    .send-action-btn {
      width: 30px;
      height: 30px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .send-action-btn svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: var(--icon);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .send-action-btn.active-blue {
      background-color: #2b82f6;
      border-radius: 50%;
    }

    .send-action-btn.active-blue svg {
      fill: #ffffff;
      stroke: none;
      width: 16px;
      height: 16px;
    }

    /* ---------- 管理用コントロールパネル ---------- */
    .control-panel {
      background-color: #1a1a1c;
      border-top: 1px solid #2a2a2c;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .sender-switch {
      display: flex;
      background-color: #0d0d0d;
      border-radius: 8px;
      padding: 2px;
    }

    .switch-btn {
      flex: 1;
      padding: 5px;
      border: none;
      background: none;
      color: #777777;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .switch-btn.active.me {
      background-color: #69e779;
      color: #000000;
    }

    .switch-btn.active.partner {
      background-color: #333333;
      color: #ffffff;
    }

    .switch-btn.active.system {
      background-color: #444444;
      color: #ffffff;
    }

    .option-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #aaaaaa;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    #file-input, #avatar-input {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <div class="header">
    <div class="header-left">
      <svg class="back-btn" viewBox="0 0 24 24"><path d="M15 4.5 7.5 12 15 19.5"/></svg>
      <span class="partner-name" id="partner-name-display" onclick="changePartnerName()">Ryo Murakami</span>
    </div>
    <div class="header-icons">
      <svg class="header-icon-svg" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="7.5"/><path d="M16 16l5.5 5.5"/><path d="M10.5 6.5v4l2.6 1.6"/>
      </svg>
      <svg class="header-icon-svg" viewBox="0 0 24 24">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/>
      </svg>
      <div class="calendar-icon-box" onclick="alert('カレンダー')">
        <span class="calendar-date">31</span>
      </div>
      <svg class="header-icon-svg" viewBox="0 0 24 24">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </div>
  </div>

  <!-- アナウンスバー -->
  <div class="announcement">
    <div class="announcement-left">
      <svg class="announcement-icon" viewBox="0 0 24 24">
        <path d="M3 10v4a1 1 0 0 0 1 1h3l9 4.5V5.5L7 9H4a1 1 0 0 0-1 1z"/><path d="M19.5 9.5a4 4 0 0 1 0 5"/><path d="M7.5 15l1.4 5h2.4l-1-4.6"/>
      </svg>
      <span class="announcement-text" id="announcement-text" onclick="changeAnnouncement()">インスタ見るな</span>
    </div>
    <svg class="announcement-arrow" viewBox="0 0 24 24"><path d="M4.5 8.5 12 16l7.5-7.5"/></svg>
  </div>

  <!-- チャットエリア -->
  <div class="chat-wrap">
    <div class="chat-area" id="chat-area" onclick="blurInput()"></div>
    <div class="scroll-bottom-btn" id="scroll-bottom-btn" onclick="scrollToBottom()">
      <svg viewBox="0 0 24 24"><path d="M12 4v16M5.5 13.5 12 20l6.5-6.5"/></svg>
    </div>
  </div>

  <!-- LINE風入力バー -->
  <div class="input-bar" id="input-bar">
    <div class="input-icons-left">
      <svg class="collapse-arrow" id="collapse-arrow" viewBox="0 0 24 24" onclick="blurInput()"><path d="M15 5l-7 7 7 7"/></svg>
      <svg class="tool-icon-svg" id="plus-btn" viewBox="0 0 24 24" onclick="document.getElementById('file-input').click()">
        <path d="M12 3.5v17M3.5 12h17"/>
      </svg>
      <svg class="tool-icon-svg" id="cam-icon" viewBox="0 0 24 24" onclick="document.getElementById('file-input').click()">
        <path d="M3 8.5a2 2 0 0 1 2-2h2.2l1.3-1.8h7l1.3 1.8H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/>
      </svg>
      <svg class="tool-icon-svg" id="img-icon" viewBox="0 0 24 24" onclick="document.getElementById('file-input').click()">
        <rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M4 17.5l5-5 3.5 3.5 2.5-2.5 5 5"/>
      </svg>
    </div>
    <div class="input-wrapper">
      <input type="text" class="text-input" id="message-input" placeholder="Aa" onfocus="focusInput()" oninput="handleInput()" onkeypress="handleKeyPress(event)">
      <svg class="tool-icon-svg" id="emoji-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/><path d="M8.3 14c.9 1.5 2.1 2.2 3.7 2.2s2.8-.7 3.7-2.2"/><circle cx="9" cy="10" r=".7" fill="#b7b7b7"/><circle cx="15" cy="10" r=".7" fill="#b7b7b7"/>
      </svg>
    </div>
    <button class="send-action-btn" id="send-action-btn" onclick="handleSendButtonAction()">
      <svg viewBox="0 0 24 24" id="send-mic-svg"></svg>
    </button>
  </div>

  <!-- 管理用設定パネル -->
  <div class="control-panel">
    <div class="sender-switch">
      <button class="switch-btn active me" id="btn-me" onclick="setSender('me')">自分 (緑)</button>
      <button class="switch-btn partner" id="btn-partner" onclick="setSender('partner')">相手 (黒)</button>
      <button class="switch-btn" id="btn-system" onclick="setSender('system')">システム</button>
    </div>
    <div class="option-row">
      <label class="checkbox-label">
        <input type="checkbox" id="read-status" checked> 既読をつける
      </label>
      <span style="cursor:pointer; color:#ff4444;" onclick="clearChat()">チャットクリア</span>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" onchange="sendImage(event)">
  <input type="file" id="avatar-input" accept="image/*" onchange="changeAvatar(event)">
</div>

<script>
  let currentSender = 'me';
  // 画像未設定のときの初期アイコン（外部サービスに頼らないSVG）
  let partnerAvatarUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4a4a4a"/>' +
    '<circle cx="50" cy="40" r="18" fill="#8a8a8a"/><path d="M14 100c0-22 16-36 36-36s36 14 36 36z" fill="#8a8a8a"/></svg>'
  );
  let isInputFocused = false;

  const MIC_SVG = '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>';
  const SEND_SVG = '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>';

  const initialMessages = [
    { sender: 'me', text: 'フライングしたのやっぱりこが', time: '19:51' },
    { sender: 'me', text: '動画見た', time: '19:51' },
    { sender: 'partner', text: 'がちか', time: '19:53' },
    { sender: 'partner', text: '動画ほしい', time: '19:53' },
    { sender: 'me', text: '俺のお父さん俺しか写してないからお前最後見れない、、', time: '20:02' },
    { sender: 'me', text: '分かってない', time: '20:02' },
    { sender: 'me', text: '途中しかないけどえーか？', time: '20:03' },
    { sender: 'me', text: 'だから俺とお前の差がみれない', time: '20:03' },
    { sender: 'partner', text: 'あーー', time: '20:04' },
    { sender: 'partner', text: 'とりまほしい', time: '20:04' },
    { sender: 'me', text: '普通に意味がわからない', time: '20:06' },
    { sender: 'me', text: '両親来なかったんか', time: '20:06' },
    { sender: 'partner', text: '多分来れてない', time: '20:11' },
    { sender: 'partner', text: 'ああお前しか映ってないのか', time: '20:11' }
  ];

  let messagesData = [];

  window.onload = function() {
    initialMessages.forEach(msg => {
      // 自分のメッセージには既読をつける
      appendMessage(msg.sender, msg.text, msg.time, msg.sender === 'me', false);
    });
    renderChat();
    updateSendButtonState();
    scrollToBottom();
    document.getElementById('chat-area').addEventListener('scroll', updateScrollButton);
  };

  function setSender(sender) {
    currentSender = sender;
    document.getElementById('btn-me').className = 'switch-btn' + (sender === 'me' ? ' active me' : '');
    document.getElementById('btn-partner').className = 'switch-btn' + (sender === 'partner' ? ' active partner' : '');
    document.getElementById('btn-system').className = 'switch-btn' + (sender === 'system' ? ' active system' : '');
  }

  function getCurrentTime() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, '0');
    return `${hours}:${minutes}`;
  }

  function focusInput() {
    isInputFocused = true;
    document.getElementById('collapse-arrow').style.display = 'block';
    document.getElementById('plus-btn').style.display = 'none';
    document.getElementById('cam-icon').style.display = 'none';
    document.getElementById('img-icon').style.display = 'none';
    updateSendButtonState();
  }

  function blurInput() {
    isInputFocused = false;
    document.getElementById('message-input').blur();
    document.getElementById('collapse-arrow').style.display = 'none';
    document.getElementById('plus-btn').style.display = 'block';
    document.getElementById('cam-icon').style.display = 'block';
    document.getElementById('img-icon').style.display = 'block';
    updateSendButtonState();
  }

  function handleInput() {
    updateSendButtonState();
  }

  function updateSendButtonState() {
    const text = document.getElementById('message-input').value;
    const btn = document.getElementById('send-action-btn');
    const svgElem = document.getElementById('send-mic-svg');

    if (text.trim().length > 0 || isInputFocused) {
      btn.className = 'send-action-btn active-blue';
      svgElem.innerHTML = SEND_SVG;
    } else {
      btn.className = 'send-action-btn';
      svgElem.innerHTML = MIC_SVG;
    }
  }

  function handleSendButtonAction() {
    const text = document.getElementById('message-input').value;
    if (text.trim().length > 0) {
      sendMessage();
    }
  }

  function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text) return;

    const timeStr = getCurrentTime();
    const isRead = document.getElementById('read-status').checked;

    appendMessage(currentSender, text, timeStr, isRead, false);
    renderChat();
    input.value = '';
    updateSendButtonState();
    scrollToBottom();
  }

  function appendMessage(sender, content, time, isRead, isImage) {
    messagesData.push({
      sender: sender,
      content: content,
      time: time,
      isRead: isRead,
      isImage: isImage
    });
  }

  function renderChat() {
    const chatArea = document.getElementById('chat-area');
    chatArea.innerHTML = '';

    for (let i = 0; i < messagesData.length; i++) {
      const msg = messagesData[i];

      if (msg.sender === 'system') {
        const sysDiv = document.createElement('div');
        sysDiv.className = 'system-msg';
        sysDiv.innerHTML = escapeHtml(msg.content);
        chatArea.appendChild(sysDiv);
        continue;
      }

      // 直前が同じ送信者・同じ時刻(分)なら「同グループの2通目以降」
      const prev = messagesData[i - 1];
      const isGrouped = !!(prev && prev.sender === msg.sender && prev.time === msg.time);

      const msgDiv = document.createElement('div');
      msgDiv.className = `msg-group ${msg.sender}${isGrouped ? ' grouped' : ''}`;

      let avatarHtml = '';
      if (msg.sender === 'partner') {
        avatarHtml = `<img src="${partnerAvatarUrl}" class="avatar" onclick="event.stopPropagation(); triggerAvatarUpload()">`;
      }

      const metaHtml = `
        <div class="msg-meta">
          ${msg.sender === 'me' && msg.isRead ? '<span>既読</span>' : ''}
          <span>${msg.time}</span>
        </div>`;

      let contentHtml = '';
      if (msg.isImage) {
        contentHtml = `<img src="${msg.content}" class="msg-img">`;
      } else {
        contentHtml = `<div class="msg-bubble">${escapeHtml(msg.content)}</div>`;
      }

      if (msg.sender === 'partner') {
        msgDiv.innerHTML = `
          ${avatarHtml}
          <div class="msg-content">${contentHtml}</div>
          ${metaHtml}
        `;
      } else {
        msgDiv.innerHTML = `
          <div class="msg-content">${contentHtml}</div>
          ${metaHtml}
        `;
      }

      chatArea.appendChild(msgDiv);
    }
    updateScrollButton();
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  }

  function sendImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const timeStr = getCurrentTime();
      const isRead = document.getElementById('read-status').checked;
      appendMessage(currentSender, e.target.result, timeStr, isRead, true);
      renderChat();
      scrollToBottom();
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function changePartnerName() {
    const currentName = document.getElementById('partner-name-display').innerText;
    const newName = prompt('相手の名前を入力してください:', currentName);
    if (newName !== null && newName.trim() !== '') {
      document.getElementById('partner-name-display').innerText = newName.trim();
    }
  }

  function changeAnnouncement() {
    const currentText = document.getElementById('announcement-text').innerText;
    const newText = prompt('アナウンスのテキストを入力してください:', currentText);
    if (newText !== null) {
      document.getElementById('announcement-text').innerText = newText;
    }
  }

  function triggerAvatarUpload() {
    document.getElementById('avatar-input').click();
  }

  function changeAvatar(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      partnerAvatarUrl = e.target.result;
      renderChat();
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function clearChat() {
    if (confirm('チャット履歴を全消去しますか？')) {
      messagesData = [];
      renderChat();
    }
  }

  function scrollToBottom() {
    const chatArea = document.getElementById('chat-area');
    chatArea.scrollTop = chatArea.scrollHeight;
    updateScrollButton();
  }

  // 一番下にいないときだけ「↓」ボタンを出す
  function updateScrollButton() {
    const chatArea = document.getElementById('chat-area');
    const btn = document.getElementById('scroll-bottom-btn');
    const away = chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight;
    btn.style.display = away > 80 ? 'flex' : 'none';
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
  }
</script>

</body>
</html>
